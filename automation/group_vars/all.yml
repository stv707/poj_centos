---
# automation/group_vars/all.yml
# =============================================================================
# COGNITOZ BETALAB - CENTOS STREAM 10 AUTOMATION CONFIGURATION
# =============================================================================

job_id: "{{ lookup('env', 'JOB_ID') | default('local-dev-' ~ lookup('pipe', 'date +%s'), true) | trim }}"
prefix: "{{ lookup('env', 'LAB_PREFIX') | default('pojcentos', true) | trim }}"

# Student Fleet & Indices (clean non-recursive resolution)
student_count_num: "{{ lookup('env', 'STUDENT_COUNT') | default(1, true) | int }}"
target_student_indices_env: "{{ lookup('env', 'TARGET_STUDENT_INDICES') | default('', true) | trim }}"
target_student_index_env: "{{ lookup('env', 'TARGET_STUDENT_INDEX') | default('', true) | trim }}"

student_count: >-
  {{
    (target_student_indices_env.split(',') | map('trim') | map('int') | list)
    if (target_student_indices_env | length > 0)
    else (
      [target_student_index_env | int]
      if (target_student_index_env | length > 0)
      else (range(1, (student_count_num | int) + 1) | list)
    )
  }}

# Student OS credentials
admin_username: "droot"
drootpass: "{{ lookup('env', 'DROOT_PASSWORD') | default(lookup('env', 'DROOT_PASS') | default('Cangetin51085108', true), true) | trim }}"
course_name: "{{ lookup('env', 'COURSE_NAME') | default('CentOS Stream 10 Administration for POJ Putrajaya', true) | trim }}"
ssh_pub_key: "{{ lookup('env', 'SSH_PUB_KEY') | default(lookup('file', '~/.ssh/id_rsa.pub', errors='ignore'), true) | trim }}"

# Azure DNS Configuration
dns_zone_name: "{{ lookup('env', 'AZURE_DNS_ZONE_NAME') | default('steven.asia', true) | trim }}"
dns_zone_rg: "{{ lookup('env', 'AZURE_DNS_ZONE_RG') | default('training-dns-zone-rg', true) | trim }}"
azure_client_id: "{{ lookup('env', 'AZURE_CLIENT_ID') | default('', true) | trim }}"
azure_secret: "{{ lookup('env', 'AZURE_SECRET') | default(lookup('env', 'AZURE_CLIENT_SECRET') | default('', true), true) | trim }}"
azure_tenant: "{{ lookup('env', 'AZURE_TENANT') | default(lookup('env', 'AZURE_TENANT_ID') | default('', true), true) | trim }}"
azure_subscription_id: "{{ lookup('env', 'AZURE_SUBSCRIPTION_ID') | default('', true) | trim }}"

# DigitalOcean Configuration
do_token: "{{ lookup('env', 'DO_TOKEN') | default('', true) | trim }}"
do_region: "{{ lookup('env', 'DO_REGION') | default('sgp1', true) | trim }}"
jumpbox_specs_in: "{{ lookup('env', 'JUMPBOX_SIZE') | default(lookup('env', 'DO_DROPLET_SIZE') | default('2cpu-4gb', true), true) | trim }}"
do_ssh_keys_raw: "{{ lookup('env', 'DO_SSH_KEYS') | default('', true) | string | trim }}"
do_ssh_keys_list: "{{ do_ssh_keys_raw.split(',') | map('trim') | list if (do_ssh_keys_raw | length > 0) else [] }}"

# CentOS Image Configuration
centos_image: "{{ lookup('env', 'DO_IMAGE') | default('centos-stream-10-x64', true) | trim }}"

do_jump_host:
  size: "{{ 's-1vcpu-2gb' if (jumpbox_specs_in == '1cpu-2gb') else ('s-2vcpu-4gb' if (jumpbox_specs_in == '2cpu-4gb') else ('s-4vcpu-8gb' if (jumpbox_specs_in == '4cpu-8gb') else ('s-8vcpu-16gb' if (jumpbox_specs_in == '8cpu-16gb') else jumpbox_specs_in))) }}"
  region: "{{ do_region }}"
  image: "{{ centos_image }}"
  ssh_keys: "{{ do_ssh_keys_list }}"
